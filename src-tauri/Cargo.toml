[package]
name = "ubet-render"
version = "0.1.2"
authors = ["ubet"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
tauri-plugin-dialog = "2"
rand = "0.8"
chrono = "0.4"
tauri-plugin-notification = "2"
futures = "0.3"
sha2 = "0.10"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
