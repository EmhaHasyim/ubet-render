name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev] # run CI on PRs opened against either protected branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + test + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: TypeScript check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

  # NOTE: no Linux backend job — this is a Windows-only app (sidecars in
  # src-tauri/binaries exist only for x86_64-pc-windows-msvc; tauri-build
  # fails on other targets looking for the per-platform sidecar).
  # backend-windows below runs the full check/clippy/test/audit gates.
  backend-windows:
    name: Backend Windows (compile + tests)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      # Prebuilt binary (binstall) instead of compiling cargo-audit from
      # source on every run (~5 min saved per job).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency audit
        working-directory: src-tauri
        run: cargo audit
